services:
  test:
    # PHPUnit 4.1.* requires PHP 5.3.3+; using 5.6 for compatibility
    image: php:5.6-cli
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "echo 'deb http://archive.debian.org/debian stretch main' > /etc/apt/sources.list
      && apt-get update -qq 2>/dev/null
      && apt-get install -y --allow-unauthenticated -qq git zip unzip > /dev/null 2>&1
      && curl -sS https://getcomposer.org/installer | php -- --quiet
      && php composer.phar install --quiet --no-interaction --prefer-dist
      && vendor/bin/phpunit --bootstrap tests/bootstrap.php tests/"
    restart: "no"
