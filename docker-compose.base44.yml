services:
  web:
    image: php:5.6-cli
    working_dir: /app
    volumes:
      - ./:/app
    command: php -S 0.0.0.0:3000 -t public
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "php", "-r", "exit(strpos(file_get_contents('http://127.0.0.1:3000/'), 'The PHP library is loaded and ready.') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
  test:
    profiles: ["tests"]
    image: php:5.6-cli
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "echo 'deb http://archive.debian.org/debian stretch main' > /etc/apt/sources.list
      && apt-get update -qq 2>/dev/null
      && apt-get install -y --allow-unauthenticated -qq git zip unzip > /dev/null 2>&1
      && curl -sS https://getcomposer.org/installer | php -- --quiet
      && php composer.phar install --quiet --no-interaction --prefer-dist
      && vendor/bin/phpunit --bootstrap /app/tests/bootstrap.php tests/"
